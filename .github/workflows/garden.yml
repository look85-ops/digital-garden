name: garden grow

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/**"

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: ./garden
        run: pip install -r requirements.txt

      - name: Run curator
        working-directory: ./garden
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/curator.py

      - name: Commit new artifacts
        run: |
          git config user.name "garden-bot"
          git config user.email "garden-bot@users.noreply.github.com"
          git add garden/artifacts/ garden/index.html
          git diff --staged --quiet || git commit -m "garden: new artifact $(date -u +'%Y-%m-%d %H:%M')"
          git push
